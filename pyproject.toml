[project]
name = "get-gap"
version = "0.1.0"
description = "Encuentra huecos comunes en las agendas de un grupo y propone fechas según el plan"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.5",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["get_gap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
